name: "oldcook iOS 12 Flutter Backport Builder"
description: "Composite action to build and audit an iOS 12 Flutter IPA on macos-15 without cross-repo workflow_call queueing."
inputs:
  recipe:
    description: "Recipe name under oldcook/recipes/"
    required: true
    default: "piliplus"
  upstream_ref:
    description: "Optional upstream tag or commit override"
    required: false
    default: ""
  engine_repo:
    description: "GitHub owner/repo hosting prebuilt engine-<ver>-ios12 Releases"
    required: false
    default: "AsabaLazy/oldcook"
outputs:
  audit_passed:
    description: "true if audit_ipa.py passed with zero launch blockers"
    value: ${{ steps.audit.outputs.passed }}
  ipa_path:
    description: "Path to generated unsigned IPA"
    value: ${{ github.workspace }}/_oldcook/dist/${{ inputs.recipe }}-ios12-unsigned.ipa
  audit_txt_path:
    description: "Path to human-readable audit report"
    value: ${{ github.workspace }}/_oldcook/dist/${{ inputs.recipe }}-audit.txt
  audit_json_path:
    description: "Path to JSON audit report"
    value: ${{ github.workspace }}/_oldcook/dist/${{ inputs.recipe }}-audit.json

runs:
  using: "composite"
  steps:
    - name: Checkout oldcook toolkit into _oldcook
      uses: actions/checkout@v4
      with:
        repository: AsabaLazy/oldcook
        path: _oldcook

    - name: Fetch iOS 12.4 SDK for static gatekeeper
      shell: bash
      working-directory: _oldcook
      run: bash tools/fetch_sdk.sh

    - name: Clone upstream source via recipe metadata
      id: meta
      shell: bash
      working-directory: _oldcook
      run: |
        python3 - <<'PY'
        import json, os, subprocess
        from pathlib import Path
        cfg = json.loads(Path("recipes/${{ inputs.recipe }}/recipe.json").read_text())
        ref = "${{ inputs.upstream_ref }}" or cfg.get("ref", "main")
        min_ios = str(cfg.get("min_ios", "12.2"))
        extra_args = cfg.get("extra_flutter_args", "")
        pwsh_steps = json.dumps(cfg.get("upstream_steps_pwsh", []))
        cmd = ["python3", "tools/apply_recipe.py", "${{ inputs.recipe }}", "--ref", ref]
        if cfg.get("clone_full_history"):
            cmd.append("--full-clone")
        subprocess.run(cmd, check=True)
        with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            out.write(f"ref={ref}\nmin_ios={min_ios}\nextra_args={extra_args}\npwsh_steps={pwsh_steps}\n")
        PY

    - name: Reset upstream working tree before running upstream pre-build hooks
      if: ${{ steps.meta.outputs.pwsh_steps != '[]' }}
      shell: bash
      working-directory: _oldcook/work/${{ inputs.recipe }}
      run: git reset --hard && git clean -fd

    - name: Setup Flutter matching upstream pubspec.yaml
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: _oldcook/work/${{ inputs.recipe }}/pubspec.yaml
        cache: true

    - name: Restore CocoaPods & Pub caches
      id: pod-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.pub-cache
          ~/Library/Caches/CocoaPods
          _oldcook/work/${{ inputs.recipe }}/ios/Pods
        key: oldcook-pods-${{ runner.os }}-${{ inputs.recipe }}-${{ hashFiles('_oldcook/work/*/pubspec.lock') }}
        restore-keys: |
          oldcook-pods-${{ runner.os }}-${{ inputs.recipe }}-

    - name: Disable SwiftPM & run upstream PowerShell pre-build hooks
      shell: bash
      working-directory: _oldcook/work/${{ inputs.recipe }}
      env:
        UPSTREAM_PWSH: ${{ steps.meta.outputs.pwsh_steps }}
      run: |
        flutter config --no-enable-swift-package-manager
        python3 - <<'PY'
        import json, os, subprocess
        ws = os.getcwd()
        env = {**os.environ, "GITHUB_WORKSPACE": ws}
        for step_cmd in json.loads(os.environ["UPSTREAM_PWSH"]):
            print(f"[upstream-pwsh] {step_cmd}")
            subprocess.run(["pwsh", "-Command", step_cmd], env=env, check=True)
        PY

    - name: Unlock flutter_tools iOS 12 deployment target & overlay prebuilt iOS 12 Engine
      shell: bash
      working-directory: _oldcook
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        FLUTTER_ROOT_DIR="$(dirname "$(dirname "$(which flutter)")")"
        python3 engine-patches/patch_flutter_ios12.py \
          --flutter-root "${FLUTTER_ROOT_DIR}" \
          --mode tools-only \
          --target-ios "${{ steps.meta.outputs.min_ios }}"
        flutter precache --ios --no-android --no-web

        CACHE_IOS="${FLUTTER_ROOT_DIR}/bin/cache/artifacts/engine/ios-release"
        FVER="$(python3 -c 'import re,pathlib; m=re.search(r"^\s{2}flutter:\s*['\''\"]?([0-9.]+)", pathlib.Path("work/${{ inputs.recipe }}/pubspec.yaml").read_text(), re.M); print(m.group(1) if m else "")')"
        if [ -n "${FVER}" ]; then
          if gh release download "engine-${FVER}-ios12" --repo "${{ inputs.engine_repo }}" -p "flutter-engine-${FVER}-ios12-arm64.tar.xz" -O /tmp/ios12-engine.tar.xz --clobber 2>/dev/null; then
            rm -rf "${CACHE_IOS}/Flutter.xcframework"
            tar -xJf /tmp/ios12-engine.tar.xz -C "${CACHE_IOS}"
            echo "[ok] Overlaid prebuilt iOS 12 Flutter.xcframework via gh release download"
          else
            ENGINE_URL="https://github.com/${{ inputs.engine_repo }}/releases/download/engine-${FVER}-ios12/flutter-engine-${FVER}-ios12-arm64.tar.xz"
            if curl -fsIL "${ENGINE_URL}" >/dev/null 2>&1; then
              curl -fL --retry 3 -o /tmp/ios12-engine.tar.xz "${ENGINE_URL}"
              rm -rf "${CACHE_IOS}/Flutter.xcframework"
              tar -xJf /tmp/ios12-engine.tar.xz -C "${CACHE_IOS}"
              echo "[ok] Overlaid prebuilt iOS 12 Flutter.xcframework from ${ENGINE_URL}"
            else
              echo "[warn] Prebuilt engine-${FVER}-ios12 not found in ${{ inputs.engine_repo }}"
            fi
          fi
        fi

    - name: Apply oldcook iOS 12 recipe overlays & vendor/patch native plugins
      shell: bash
      working-directory: _oldcook
      run: |
        python3 tools/apply_recipe.py "${{ inputs.recipe }}" --overlay-only
        (cd "work/${{ inputs.recipe }}" && flutter pub get)
        python3 tools/patch_ios_sources.py "work/${{ inputs.recipe }}" --min-ios "${{ steps.meta.outputs.min_ios }}"
        (cd "work/${{ inputs.recipe }}" && flutter pub get)

    - name: Build unsigned iOS 12 app, rewrite App.framework minos & package IPA
      shell: bash
      working-directory: _oldcook/work/${{ inputs.recipe }}
      run: |
        DIST_DIR="${GITHUB_WORKSPACE}/_oldcook/dist"
        flutter build ios --release --no-codesign ${{ steps.meta.outputs.extra_args }}
        mkdir -p dist_payload/Payload "${DIST_DIR}"
        cp -R build/ios/iphoneos/Runner.app dist_payload/Payload/
        APP_BIN="dist_payload/Payload/Runner.app/Frameworks/App.framework/App"
        if [ -f "${APP_BIN}" ]; then
          python3 "${GITHUB_WORKSPACE}/_oldcook/tools/relink_app_framework.py" "${APP_BIN}" \
            --min-ios "${{ steps.meta.outputs.min_ios }}" \
            --sdk "${GITHUB_WORKSPACE}/_oldcook/sdks/iPhoneOS12.4.sdk"
        fi
        /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion ${{ steps.meta.outputs.min_ios }}" "dist_payload/Payload/Runner.app/Frameworks/App.framework/Info.plist" || true
        find dist_payload/Payload/Runner.app -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \; || true
        codesign --force --sign - --preserve-metadata=identifier,entitlements dist_payload/Payload/Runner.app || true
        (cd dist_payload && zip -qr9 "${DIST_DIR}/${{ inputs.recipe }}-ios12-unsigned.ipa" Payload)

    - name: Save CocoaPods & Pub caches (even on failure)
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.pub-cache
          ~/Library/Caches/CocoaPods
          _oldcook/work/${{ inputs.recipe }}/ios/Pods
        key: oldcook-pods-${{ runner.os }}-${{ inputs.recipe }}-${{ hashFiles('_oldcook/work/*/pubspec.lock') }}-${{ github.run_id }}

    - name: Run offline iOS 12 Mach-O & symbol gatekeeper
      id: audit
      shell: bash
      working-directory: _oldcook
      run: |
        set +e
        python3 tools/audit_ipa.py "dist/${{ inputs.recipe }}-ios12-unsigned.ipa" \
          --target 12.4 \
          --json "dist/${{ inputs.recipe }}-audit.json" | tee "dist/${{ inputs.recipe }}-audit.txt"
        RC="${PIPESTATUS[0]}"
        set -e
        if [ "${RC}" -eq 0 ]; then
          echo "passed=true" >> "${GITHUB_OUTPUT}"
        else
          echo "passed=false" >> "${GITHUB_OUTPUT}"
        fi
